[package]
name = "tree-sitter-wesl"
version = "0.1.0"
edition = "2021"
description = "Wesl grammar for tree-sitter"
readme = "README.md"
repository = "https://github.com/tree-sitter/tree-sitter-wesl"
license = "MIT"
keywords = ["incremental", "parsing", "tree-sitter", "wesl"]
categories = ["parsing", "text-editors"]
autoexamples = false

build = "bindings/rust/build.rs"
include = ["bindings/rust/*", "grammar.js", "queries/*", "src/*"]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[dev-dependencies]
tree-sitter = { version = "0.27" }

[build-dependencies]
cc = "1.0.87"
